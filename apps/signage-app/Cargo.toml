[package]
name = "signage-app"
description = "Example Rill display server: an airport departures board, a store-window ad, a museum exhibit label."
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
rill-doc = { path = "../../crates/rill-doc" }
rill-appkit = { path = "../../crates/rill-appkit" }
rill-auth = { path = "../../crates/rill-auth" }
rill-protocol = { path = "../../crates/rill-protocol" }
rill-server = { path = "../../platform/rill-server" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
# localtime_r: the board shows the building's clock.
libc.workspace = true
# morning.toml: the site the sky map is computed for.
toml.workspace = true
# weather.json (Open-Meteo hourly) for the message planner and the sky map.
serde_json = "1"

[dev-dependencies]
# The weather module names icons; the test checks every name exists.
rill-ui = { path = "../../crates/rill-ui" }

[lints]
workspace = true
